<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rosana Liu — The Case Files</title>
  <meta name="description" content="Rosana Liu's portfolio, played as a 1990s Japanese text adventure. Every case is something Rosana built: machine learning, aesthetic software and writing.">
  <meta name="theme-color" content="#000011">
  <link rel="canonical" href="https://rosanaliu.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rosanaliu.com/">
  <meta property="og:title" content="Rosana Liu — The Case Files">
  <meta property="og:description" content="Every case is something Rosana built.">
  <meta property="og:image" content="https://rosanaliu.com/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage" class="scan">
    <header id="bar">
      <h1>Rosana Liu <span>事件簿</span></h1>
      <p id="where"></p>
      <p id="tally"></p>
      <div id="sys"></div>
    </header>

    <section id="view" aria-label="Scene">
      <canvas id="scene" width="448" height="272" aria-hidden="true"></canvas>
      <canvas id="bust" width="256" height="272" aria-hidden="true"></canvas>
      <div id="spots"></div>
      <div id="sheet" hidden></div>
      <div id="stamp" hidden></div>
    </section>

    <nav id="cmds" aria-label="Commands"></nav>

    <section id="box" aria-label="Dialogue">
      <span id="who" hidden></span>
      <p id="line" aria-hidden="true"></p>
      <p id="sr" class="sr" aria-live="polite"></p>
      <i id="more" hidden aria-hidden="true">▼</i>
    </section>

    <div id="front" hidden>
      <div id="cover">
        <img id="cover-art" src="assets/cover.webp" alt="ROSANA_98: The Case Archive. Rosana rests her chin on her hand at a desk at night, beside an evidence board." loading="lazy">
        <img id="cover-logo" src="assets/cover-logo.webp" alt="ROSANA_98: The Case Archive" loading="lazy">
        <img id="cover-m" src="assets/cover-m.webp" alt="" loading="lazy">
        <div id="menu"></div>
      </div>
      <div id="boot" hidden aria-hidden="true"></div>
    </div>
  </main>

  <noscript>
    <h1>Rosana Liu</h1>
    <p>This portfolio is a small text adventure that needs JavaScript. You can also find my work on <a href="https://github.com/RosanaL">GitHub</a> and <a href="https://www.linkedin.com/in/rosana-liu-2a8050228/">LinkedIn</a>.</p>
  </noscript>

  <script src="js/content.js"></script>
  <script src="js/cases.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
